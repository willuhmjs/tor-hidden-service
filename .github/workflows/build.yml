name: build

on:
  push:
    branches: [main]
    # Bare semver (1.0.1), not v-prefixed: metadata-action's {{version}} output strips the v,
    # so tagging v1.0.1 here would publish an image tag nobody references. A "v*" filter alone
    # matched nothing and silently skipped the build.
    tags: ["*", "v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/willuhmjs/tor-hidden-service
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Single-arch on purpose: the homelab node is amd64 and a cross-arch build here would
      # only exercise Tor under emulation. Add linux/arm64 if a node ever needs it.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations ride along with the image so consumers can verify what built it.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails the run on a fixable HIGH/CRITICAL in the shipped image. There is no OS layer to
      # speak of (scratch), so a hit means tor or one of its three libraries needs a rebuild.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/willuhmjs/tor-hidden-service@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
